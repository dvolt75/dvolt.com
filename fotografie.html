<header class="page-head col"><div class="eyebrow">Iconografia</div><h1>Fotografie</h1><p class="sub">Ritratti, luoghi e frontespizi dell’Ottocento.</p></header>
<div class="photos"><figure id="foto-1"><div class="frame"><img src="assets/img/whitman-1.jpg" width="259" height="260" alt="Il ritratto della prima edizione" loading="lazy"></div><figcaption><b>Il ritratto della prima edizione</b><span>Incisione di Samuel Hollyer da un dagherrotipo di Gabriel Harrison del 1854. Stava al posto del nome dell’autore, di fronte al frontespizio di <em>Foglie d’erba</em> (1855).</span></figcaption></figure><figure id="foto-4"><div class="frame"><img src="assets/img/whitman-4.jpg" width="350" height="412" alt="Il ritratto dell&#x27;edizione 1860" loading="lazy"></div><figcaption><b>Il ritratto dell’edizione 1860</b><span>Incisione di Stephen Alonzo Schoff da un dipinto di Charles Hine del 1859, con la firma del poeta. Frontespizio della terza edizione.</span></figcaption></figure><figure id="foto-2"><div class="frame"><img src="assets/img/whitman-2.jpg" width="311" height="492" alt="Ritratto con firma" loading="lazy"></div><figcaption><b>Ritratto con firma</b><span>Fotografia firmata di Whitman nella piena maturità, con cappello e bastone. La data è incerta.</span></figcaption></figure><figure id="foto-3"><div class="frame"><img src="assets/img/whitman-3.jpg" width="400" height="318" alt="La casa natale" loading="lazy"></div><figcaption><b>La casa natale</b><span>La casa di West Hills, presso Huntington, a Long Island, dove Whitman nacque il 31 maggio 1819. Oggi è un sito storico dello Stato di New York.</span></figcaption></figure><figure id="foto-5"><div class="frame"><img src="assets/img/whitman-5.jpg" width="350" height="374" alt="I funerali di Lincoln" loading="lazy"></div><figcaption><b>I funerali di Lincoln</b><span>Il corteo funebre del presidente Lincoln a Washington, nell’aprile del 1865, in un’incisione dell’epoca. Whitman gli dedicò l’elegia «When Lilacs Last in the Dooryard Bloom’d».</span></figcaption></figure><figure id="foto-6"><div class="frame"><img src="assets/img/whitman-6.jpg" width="325" height="379" alt="La casa di Mickle Street" loading="lazy"></div><figcaption><b>La casa di Mickle Street</b><span>La casa al 328 di Mickle Street a Camden, nel New Jersey, che Whitman comprò nel 1884 e dove morì nel 1892. È aperta al pubblico.</span></figcaption></figure><figure id="foto-7"><div class="frame"><img src="assets/img/whitman-7.jpg" width="350" height="424" alt="Il filosofo che ride" loading="lazy"></div><figcaption><b>Il filosofo che ride</b><span>Fotografia di George C. Cox, 1887, con firma e data autografe. Era tra le preferite di Whitman, che la chiamava «il filosofo che ride».</span></figcaption></figure><figure id="foto-8"><div class="frame"><img src="assets/img/whitman-8.jpg" width="350" height="362" alt="Il frontespizio del 1891–92" loading="lazy"></div><figcaption><b>Il frontespizio del 1891–92</b><span>Il frontespizio dell’edizione «del letto di morte» (Filadelfia, David McKay), con l’epigrafe «Come, said my Soul» e la firma del poeta.</span></figcaption></figure></div>
